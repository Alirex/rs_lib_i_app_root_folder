[package]
name = "app_root_folder"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"

description = "Get the path to the app root folder (the folder of the executable, or of the project when run from target/)"
license = "ISC"
documentation = "https://docs.rs/app_root_folder"
repository = "https://github.com/Alirex/rs_lib_i_app_root_folder"
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE.txt", "/CHANGELOG.md"]

keywords = ["path", "root", "executable", "directory"]
categories = ["filesystem"]

[dependencies]

# Strict lints: https://github.com/evocaslab/hq/blob/main/practices/rust-service.md#lints
# pedantic, nursery and cargo as groups; restriction lints picked one by one (never the group).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unnameable_types = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate versions are deny.toml's job.
multiple_crate_versions = "allow"
# Nursery lints with too many false positives.
missing_const_for_fn = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"
future_not_send = "allow"
too_long_first_doc_paragraph = "allow"
# Restriction: no panics or debug leftovers outside tests.
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"
# Restriction: suppressions stay visible (#[expect(lint, reason = "...")] only).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Restriction: clearer code.
as_underscore = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
