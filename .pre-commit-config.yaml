exclude: |
  (?x)^(
    \.idea/.*
  )$

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/Alirex/pre-commit-just
    rev: v0.2.1
    hooks:
      - id: format-justfile

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.10.0
    hooks:
      - id: pre-commit-update

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        files: \.(json|ya?ml|md)$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true

  - repo: local
    # Rust hooks. Installed with rustup (rust-toolchain.toml pins the compiler).
    hooks:
      - id: rust-format
        name: Rust format
        entry: scripts/quality/cargo.sh fmt --all --
        pass_filenames: false
        types: [rust]
        language: system

      - id: rust-clippy
        name: Rust clippy
        # Lints are warn in Cargo.toml [lints]; the gate turns every warning into an error.
        entry: scripts/quality/cargo.sh clippy --locked --all-targets --all-features -- -D warnings
        pass_filenames: false
        types: [rust]
        language: system

      - id: rust-tests
        name: Rust tests (unit and doc tests)
        entry: scripts/quality/cargo.sh test --locked --all-features
        pass_filenames: false
        types: [rust]
        language: system

      - id: rust-doc
        name: Rust doc (broken links are errors)
        entry: env RUSTDOCFLAGS=-Dwarnings scripts/quality/cargo.sh doc --locked --no-deps --all-features
        pass_filenames: false
        types: [rust]
        language: system
